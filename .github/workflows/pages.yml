name: Deploy learn/ to GitHub Pages

# Publishes the learn/ folder as the site root, so the course is served at
# https://aleromano92.github.io/cloudio/  (nothing else in the repo is exposed).
#
# One-time setup: repo Settings -> Pages -> Source -> "GitHub Actions".
# After that, every push that touches learn/ redeploys automatically.

on:
  push:
    branches: [master]
    paths:
      - "learn/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./learn
      - id: deployment
        uses: actions/deploy-pages@v4
