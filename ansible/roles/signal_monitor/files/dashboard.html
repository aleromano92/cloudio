<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cloudio signal</title>
<style>
  body { font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #111; color: #ddd; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 12px; margin-bottom: 20px; }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat { min-width: 110px; }
  .stat .label { color: #888; font-size: 11px; text-transform: uppercase; }
  .stat .value { font-size: 22px; font-weight: 600; }
  .stat .value.dim { color: #555; }
  svg { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 4px; }
  .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px; margin-bottom: 24px; }
  @media (max-width: 900px) {
    .chart-grid { grid-template-columns: 1fr; }
  }
  .chart h2 { font-size: 13px; color: #aaa; margin: 0 0 6px; }
  .legend { font-size: 11px; color: #888; margin-bottom: 6px; }
  .legend span { margin-right: 14px; }
  .swatch { display: inline-block; width: 8px; height: 8px; margin-right: 4px; }
  .hint { font-size: 11px; color: #666; margin: -2px 0 8px; }
  .pt { pointer-events: none; }
  .threshold-label { font-size: 9px; }
  .tick-label { font-size: 9px; }
  .weeknav { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .weeknav button { background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; width: 30px;
    height: 28px; border-radius: 5px; font-size: 14px; cursor: pointer; }
  .weeknav button:disabled { color: #444; cursor: default; }
  .weeknav button:not(:disabled):hover { background: #2a2a2a; }
  .weeknav .week-label { font-size: 13px; min-width: 210px; }
  .weeknav .week-meta { color: #777; font-size: 11px; }
  .chart-wrap { position: relative; }
  .chart-wrap svg { cursor: crosshair; width: 100%; height: auto; display: block; }

  #tooltip { position: fixed; display: none; background: #222; border: 1px solid #333;
    border-radius: 5px; padding: 6px 9px; font-size: 12px; line-height: 1.5; color: #ddd;
    pointer-events: none; z-index: 20; box-shadow: 0 4px 14px rgba(0,0,0,0.4); white-space: nowrap; }
  #tooltip .tt-time { color: #888; font-size: 10.5px; margin-bottom: 2px; }

  .info { position: relative; display: inline-block; width: 12px; height: 12px; margin-left: 4px;
    border: 1px solid #666; border-radius: 50%; color: #888; font-size: 9px; line-height: 11px;
    text-align: center; text-transform: none; cursor: help; }
  .info .tip { display: none; position: absolute; bottom: 130%; left: 0; width: 230px;
    background: #222; border: 1px solid #333; border-radius: 5px; padding: 8px 10px;
    font-size: 11.5px; line-height: 1.45; color: #ccc; text-transform: none; font-weight: 400;
    z-index: 10; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
  .info:hover .tip, .info:focus .tip { display: block; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #999; padding: 6px 14px;
    border-radius: 5px; font-size: 13px; cursor: pointer; }
  .tab-btn.active { background: #2a2a2a; color: #fff; border-color: #3a3a3a; }
  .tab-btn:hover { color: #ddd; }

  .table-wrap { overflow-x: auto; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { padding: 7px 12px; text-align: right; border-bottom: 1px solid #222; white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #888; font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.03em; }
  tbody tr:hover td { background: #202020; }
  td.dim { color: #555; }

  .outages { margin-bottom: 22px; }
  .outages h2 { font-size: 13px; color: #aaa; margin: 0 0 6px; }
  .outage-strip { position: relative; height: 22px; background: #1a1a1a; border: 1px solid #2a2a2a;
    border-radius: 4px; overflow: hidden; }
  .outage-strip .day { position: absolute; top: 0; bottom: 0; border-left: 1px solid #262626;
    font-size: 9px; color: #555; padding: 2px 4px; }
  .outage-strip .seg { position: absolute; top: 3px; bottom: 3px; min-width: 3px; border-radius: 2px;
    background: #b1544a; }
  .outage-strip .seg.ongoing { background: #d9913a; }
  .outage-list { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12px; color: #bbb; }
  .outage-list li { padding: 3px 0; font-variant-numeric: tabular-nums; }
  .outage-list .why { color: #777; }
  .outage-summary { font-size: 11px; color: #777; margin-top: 6px; }
</style>
</head>
<body>
  <h1>cloudio signal</h1>
  <div class="sub" id="sub">loading metrics.jsonl&hellip;</div>
  <div class="stats" id="stats"></div>

  <div class="weeknav">
    <button id="weekPrev" type="button" title="Previous week">&lsaquo;</button>
    <span class="week-label" id="weekLabel"></span>
    <button id="weekNext" type="button" title="Next week">&rsaquo;</button>
    <span class="week-meta" id="weekMeta"></span>
  </div>

  <div class="outages" id="outages"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="charts" type="button">Charts</button>
    <button class="tab-btn" data-tab="table" type="button">Table</button>
  </div>

  <div id="chartsView">
    <div class="chart-grid" id="chartGrid"></div>
  </div>

  <div id="tableView" hidden>
    <div class="table-wrap">
      <table>
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // --- Readings ------------------------------------------------------------
    // The collector writes typed readings (numbers, or null when absent), so
    // "has a reading" is one rule everywhere.
    const Format = {
      value: v => (typeof v === "number" && Number.isFinite(v) ? v : null),
      number: v => String(Math.round(v * 10) / 10),
      signed: v => (v < 0 ? "−" + Math.abs(v) : String(v)),
    };

    // --- Metric definitions ----------------------------------------------------
    // The one place a metric's meaning lives: where it's read from, its unit,
    // colour, explanation and quality bands. Stat tiles, chart hints, chart
    // threshold lines and the table all derive from this.
    const TEMP_BANDS = { above: { at: 75, word: "caution (est.)", tone: "bad" } };

    const METRICS = {
      downloadMbps: {
        label: "Download", unit: "Mbps", color: "#4fc3a1", legend: "download Mbps",
        read: r => r.speedtest?.download_mbps,
        tip: "Download throughput to the nearest Ookla server. Matters for file transfers, streaming quality, and app/OS updates.",
      },
      uploadMbps: {
        label: "Upload", unit: "Mbps", color: "#c78a3d", legend: "upload Mbps",
        read: r => r.speedtest?.upload_mbps,
        tip: "Upload throughput to the same server. Matters for video calls, cloud backups, and anything that pushes data out &mdash; e.g. the Anran cameras' remote-view stream.",
      },
      pingMs: {
        label: "Ping", unit: "ms",
        read: r => r.speedtest?.ping_ms,
        tip: "Round-trip time to the test server. Lower means snappier calls, gaming, and remote access (SSH/Proxmox UI over Tailscale).",
      },
      jitterMs: {
        label: "Jitter", unit: "ms",
        read: r => r.speedtest?.jitter_ms,
        tip: "How much ping varies between packets, not just its average. High jitter causes choppy audio/video even when average ping looks fine &mdash; often a better predictor of a \"laggy\" call than ping itself.",
      },
      nrRsrp: {
        label: "5G strength", unit: "dBm", color: "#4fc3a1", legend: "signal strength",
        read: r => r.zte?.Z5g_rsrp,
        tip: "How strong the 5G signal from the mast is, in dBm. Technically RSRP (reference signal received power), shown as NR RSRP in the router's own pages.",
        blurb: "Closer to 0 is stronger.",
        bands: { above: { at: -80, word: "strong" }, between: "workable", below: { at: -100, word: "weak" } },
      },
      nrSinr: {
        label: "5G quality", unit: "dB", color: "#c78a3d", legend: "signal quality",
        read: r => r.zte?.Z5g_SINR,
        tip: "How clean the 5G signal is, not just how strong, in dB. Technically SINR (signal to interference plus noise ratio), shown as NR SINR in the router's own pages.",
        blurb: "Higher is cleaner &mdash; predicts real achievable speed better than strength alone.",
        bands: { above: { at: 13, word: "good" }, between: "fair", below: { at: 0, word: "poor" } },
      },
      mdmTempC: {
        label: "4G modem", unit: "°C", color: "#4fc3a1", legend: "4G modem",
        read: r => r.zte?.pm_sensor_mdm,
        tip: "4G modem chip temperature, in &deg;C, as reported by the router itself. Tracked to catch a thermal shutdown before it takes the connection down.",
        bands: TEMP_BANDS,
      },
      modem5gTempC: {
        label: "5G modem", unit: "°C", color: "#c78a3d", legend: "5G modem",
        read: r => r.zte?.pm_modem_5g,
        tip: "5G modem chip temperature, in &deg;C. Runs separately from the 4G modem; either one overheating can drop the connection.",
        bands: TEMP_BANDS,
      },
    };

    const TABLE_METRICS = ["downloadMbps", "uploadMbps", "pingMs", "jitterMs", "nrRsrp", "nrSinr", "mdmTempC", "modem5gTempC"];

    // Text readings: identity, not quantity. Never averaged or charted -- a
    // change of BTS is the interesting event, and cell_id's leading digits are
    // the BTS, so the two columns together show sector moves vs mast moves.
    const TEXT_COLUMNS = [
      { key: "mode", label: "Mode", read: r => r.zte?.network_type },
      { key: "bts", label: "Mast", read: r => r.zte?.enodeb_id },
      { key: "cell", label: "4G cell", read: r => r.zte?.cell_id },
      { key: "band", label: "4G band", read: r => r.zte?.lte_band },
      { key: "lock", label: "4G band lock", read: r => lteLock(r.zte?.lte_band_lock) },
      // Two n78 cells serve this house, ~26 dB apart: 1f at -71 dBm, 15 at -97.
      // Which one the modem holds moves throughput more than the 4G lock does,
      // so a fair comparison between locks is within one 5G cell.
      { key: "nrCell", label: "5G cell", read: r => r.zte?.nr5g_pci },
    ];

    // The router reports the LTE lock as a bitmask (band N is bit N-1).
    function lteLock(mask) {
      if (!mask) return null;
      const bits = BigInt(mask);
      const bands = [];
      for (let b = 1n; b <= 64n; b++) if (bits & (1n << (b - 1n))) bands.push(`B${b}`);
      return bands.length > 8 ? "AUTO" : bands.join("+");
    }

    // Fixed, domain-meaningful axes: auto-scaling misrepresents proportion, and
    // a flat reading auto-scaled to its own range draws a degenerate axis.
    // Different units get separate charts, never a dual axis.
    const CHARTS = [
      { title: "Throughput", metrics: ["downloadMbps", "uploadMbps"], range: { min: 0, max: 1000 } },
      { title: "5G signal strength (dBm)", metrics: ["nrRsrp"], range: { min: -120, max: -60 } },
      { title: "5G signal quality (dB)", metrics: ["nrSinr"], range: { min: -10, max: 30 } },
      {
        title: "Modem temperature (&deg;C)", metrics: ["mdmTempC", "modem5gTempC"], range: { min: 0, max: 100 },
        note: "ZTE doesn't publish an exact shutdown threshold; the line marks a general caution zone for cellular PA hardware, not a documented cutoff.",
      },
    ];

    function bandSentence(metric) {
      const b = metric.bands;
      if (!b || !b.above || !b.below) return "";
      const hi = Format.signed(b.above.at), lo = Format.signed(b.below.at);
      return `${hi} or better: ${b.above.word} &middot; ${lo} to ${hi}: ${b.between} &middot; below ${lo}: ${b.below.word}.`;
    }

    function bandLines(metric) {
      const b = metric.bands || {};
      return [
        b.above && { at: b.above.at, label: `${b.above.word} ↑`, tone: b.above.tone || "good" },
        b.below && { at: b.below.at, label: `${b.below.word} ↓`, tone: b.below.tone || "bad" },
      ].filter(Boolean);
    }

    // --- Chart module ------------------------------------------------------------
    // Draws one fixed-axis time series chart into a container. Owns its own
    // size, geometry, threshold lines, empty state and hover tooltip; callers
    // only supply readings aligned to `times`.
    const Chart = (() => {
      const NS = "http://www.w3.org/2000/svg";
      const W = 900, H = 180, PAD = 34;
      const TONES = { good: "#5fa88f", bad: "#b1544a" };
      let tooltip;

      function node(name, attrs, text) {
        const e = document.createElementNS(NS, name);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text != null) e.textContent = text;
        return e;
      }

      function tooltipEl() {
        if (!tooltip) {
          tooltip = document.createElement("div");
          tooltip.id = "tooltip";
          document.body.appendChild(tooltip);
        }
        return tooltip;
      }

      // Hovering anywhere over the chart snaps to the nearest sample that has a
      // reading for this chart, so a failed collection run never blanks the
      // tooltip when a real reading sits one sample over.
      function hover(svg, times, series) {
        const tip = tooltipEl();
        const n = times.length;
        const hasReading = i => series.some(s => s.values[i] !== null);

        function nearest(clientX) {
          const r = svg.getBoundingClientRect();
          const frac = (((clientX - r.left) / r.width) * W - PAD) / (W - PAD * 2);
          const idx = Math.max(0, Math.min(n - 1, Math.round(frac * (n - 1))));
          for (let d = 0; d < n; d++) {
            if (idx - d >= 0 && hasReading(idx - d)) return idx - d;
            if (idx + d < n && hasReading(idx + d)) return idx + d;
          }
          return -1;
        }

        svg.onmousemove = e => {
          const i = nearest(e.clientX);
          if (i < 0) { tip.style.display = "none"; return; }
          const lines = series
            .filter(s => s.values[i] !== null)
            .map(s => `<div>${s.label}: ${Format.number(s.values[i])} ${s.unit}</div>`);
          tip.innerHTML = `<div class="tt-time">${new Date(times[i]).toLocaleString()}</div>${lines.join("")}`;
          tip.style.display = "block";
          // Measured after display:block (a hidden element has zero size), then
          // flipped to the other side of the cursor if it would leave the viewport.
          const tw = tip.offsetWidth, th = tip.offsetHeight;
          let left = e.clientX + 14, top = e.clientY + 14;
          if (left + tw > window.innerWidth) left = e.clientX - tw - 14;
          if (top + th > window.innerHeight) top = e.clientY - th - 14;
          tip.style.left = Math.max(4, left) + "px";
          tip.style.top = Math.max(4, top) + "px";
        };
        svg.onmouseleave = () => { tip.style.display = "none"; };
      }

      // Ticks at local midnight and midday, so a reading can be placed in the
      // day without hovering it. Positions come from the sample index, since
      // that's what the x axis is.
      function timeTicks(times) {
        const half = t => Math.floor((new Date(t) - new Date(t).getTimezoneOffset() * 60000) / 43200000);
        const ticks = [];
        for (let i = 1; i < times.length; i++) {
          if (half(times[i]) === half(times[i - 1])) continue;
          const d = new Date(times[i]);
          ticks.push({
            i,
            label: d.getHours() < 12
              ? d.toLocaleDateString(undefined, { weekday: "short", day: "numeric" })
              : "12:00",
          });
        }
        return ticks;
      }

      function render(container, { times, series, range, bands = [] }) {
        const svg = node("svg", { viewBox: `0 0 ${W} ${H}` });
        container.replaceChildren(svg);

        if (!series.some(s => s.values.filter(v => v !== null).length >= 2)) {
          svg.appendChild(node("text", { x: W / 2, y: H / 2, fill: "#555", "text-anchor": "middle", "font-size": 12 }, "not enough data yet"));
          return;
        }

        const n = times.length;
        const x = i => PAD + (n === 1 ? 0 : i / (n - 1)) * (W - PAD * 2);
        const y = v => H - PAD - ((v - range.min) / (range.max - range.min)) * (H - PAD * 2);

        for (const tick of timeTicks(times)) {
          svg.appendChild(node("line", {
            x1: x(tick.i).toFixed(1), x2: x(tick.i).toFixed(1), y1: PAD - 8, y2: H - PAD,
            stroke: "#333", "stroke-width": 1,
          }));
          svg.appendChild(node("text", {
            class: "tick-label", x: x(tick.i).toFixed(1), y: H - PAD + 13, fill: "#777", "text-anchor": "middle",
          }, tick.label));
        }

        const drawn = new Set();
        for (const band of bands) {
          if (drawn.has(band.at) || band.at < range.min || band.at > range.max) continue;
          drawn.add(band.at);
          const color = TONES[band.tone];
          svg.appendChild(node("line", {
            x1: PAD, x2: W - 4, y1: y(band.at).toFixed(1), y2: y(band.at).toFixed(1),
            stroke: color, "stroke-width": 1, "stroke-dasharray": "4,3", opacity: 0.6,
          }));
          svg.appendChild(node("text", { class: "threshold-label", x: PAD + 4, y: (y(band.at) - 3).toFixed(1), fill: color }, band.label));
        }

        for (const s of series) {
          const points = s.values.flatMap((v, i) => (v === null ? [] : [[x(i).toFixed(1), y(v).toFixed(1)]]));
          if (points.length >= 2) {
            svg.appendChild(node("polyline", { points: points.map(p => p.join(",")).join(" "), fill: "none", stroke: s.color, "stroke-width": 1.6 }));
          }
          for (const [cx, cy] of points) {
            svg.appendChild(node("circle", { class: "pt", cx, cy, r: 3, fill: s.color }));
          }
        }

        const axisColor = series.length === 1 ? series[0].color : "#888";
        svg.appendChild(node("text", { x: 4, y: PAD, fill: axisColor, "font-size": 10 }, Format.number(range.max)));
        svg.appendChild(node("text", { x: 4, y: H - PAD + 4, fill: axisColor, "font-size": 10 }, Format.number(range.min)));

        hover(svg, times, series);
      }

      return { render };
    })();

    // --- Page ----------------------------------------------------------------------
    function parseJsonl(text) {
      return text.split("\n").filter(Boolean).flatMap(line => {
        try { return [JSON.parse(line)]; } catch { return []; }
      });
    }

    // logrotate keeps the older weeks next to the live file as .1.gz, .2.gz …
    // Fetching and inflating those is what makes navigating back a week work;
    // a missing file just ends the walk.
    async function fetchRotated() {
      if (!window.DecompressionStream) return [];
      const rows = [];
      for (let n = 1; n <= 12; n++) {
        const res = await fetch(`metrics.jsonl.${n}.gz`, { cache: "no-store" }).catch(() => null);
        if (!res || !res.ok) break;
        const stream = res.body.pipeThrough(new DecompressionStream("gzip"));
        rows.push(...parseJsonl(await new Response(stream).text()));
      }
      return rows;
    }

    async function fetchAllRows() {
      const live = await fetch("metrics.jsonl", { cache: "no-store" });
      const rows = parseJsonl(await live.text()).concat(await fetchRotated());
      return rows.sort((a, b) => a.timestamp.localeCompare(b.timestamp));
    }

    function toSamples(rows) {
      return rows.map(r => {
        const sample = { timestamp: r.timestamp };
        for (const [key, metric] of Object.entries(METRICS)) sample[key] = Format.value(metric.read(r));
        for (const col of TEXT_COLUMNS) {
          const v = col.read(r);
          sample[col.key] = v === null || v === undefined || v === "" ? null : String(v);
        }
        return sample;
      });
    }

    // Weeks run Monday to Sunday in the viewer's own timezone, since that's
    // how the nights being compared are experienced.
    // --- Watchdog outages --------------------------------------------------------
    // watchdog-events.jsonl is written by cloudio-watchdog: a "down" when pings
    // fail, a "step" per rung of the recovery ladder, an "up" when traffic flows
    // again. One outage is everything from a "down" to the "up" that closes it.
    const FIXED_BY = {
      "auto": "4G bands unlocked (AUTO)",
      "known-good": "known-good band locked",
      "reboot": "modem reboot",
      "self": "recovered on its own",
    };

    async function fetchEvents() {
      const res = await fetch("watchdog-events.jsonl", { cache: "no-store" }).catch(() => null);
      return res && res.ok ? parseJsonl(await res.text()) : [];
    }

    function toOutages(events) {
      const outages = [];
      let open = null;
      for (const e of events) {
        if (e.event === "down") open = { start: e.since, router: e.router || {} };
        else if (e.event === "up") {
          outages.push({ router: {}, ...open, start: e.down_since, seconds: e.down_seconds, fixedBy: e.fixed_by });
          open = null;
        }
      }
      if (open) outages.push({ ...open, seconds: (Date.now() - new Date(open.start).getTime()) / 1000, ongoing: true });
      return outages;
    }

    function duration(seconds) {
      const s = Math.round(seconds);
      if (s < 60) return `${s}s`;
      if (s < 3600) return `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`;
      return `${Math.floor(s / 3600)}h ${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}m`;
    }

    // What the router said while the link was down: that's what separates "B1
    // switched off" from "modem wedged" when reading these back.
    function routerSummary(r) {
      const parts = [r.network_type, r.wan_active_band, r.lte_rsrp != null ? `${r.lte_rsrp} dBm` : null,
        r.enodeb_id ? `mast ${r.enodeb_id}` : null].filter(Boolean);
      return parts.length ? `router: ${parts.join(", ")}` : "";
    }

    let watchdogSince = null;
    let outages = [];

    function renderOutages(weekStartMs) {
      const el = document.getElementById("outages");
      const span = 7 * 86400000;
      const weekEnd = weekStartMs + span;
      const inWeek = outages.filter(o => {
        const t = new Date(o.start).getTime();
        return t >= weekStartMs && t < weekEnd;
      });

      const days = [...Array(7).keys()].map(i => {
        const d = new Date(weekStartMs + i * 86400000);
        return `<span class="day" style="left:${(i / 7) * 100}%">${d.toLocaleDateString(undefined, { weekday: "short" })}</span>`;
      }).join("");
      const segs = inWeek.map(o => {
        const t = new Date(o.start).getTime();
        const left = ((t - weekStartMs) / span) * 100;
        const width = Math.min((o.seconds * 1000 / span) * 100, 100 - left);
        const label = `${new Date(o.start).toLocaleString()} · ${duration(o.seconds)} · ${o.ongoing ? "ongoing" : FIXED_BY[o.fixedBy] || o.fixedBy}`;
        return `<span class="seg ${o.ongoing ? "ongoing" : ""}" style="left:${left}%;width:${width}%" title="${label}"></span>`;
      }).join("");

      let summary;
      if (!watchdogSince || watchdogSince.getTime() >= weekEnd) summary = "watchdog wasn't running yet this week";
      else if (!inWeek.length) summary = "no outages this week";
      else {
        const total = inWeek.reduce((a, o) => a + o.seconds, 0);
        summary = `${inWeek.length} outage${inWeek.length > 1 ? "s" : ""}, ${duration(total)} down in total`;
      }
      if (watchdogSince && watchdogSince.getTime() > weekStartMs && watchdogSince.getTime() < weekEnd)
        summary += ` · watchdog running since ${watchdogSince.toLocaleString()}`;

      const list = inWeek.slice().reverse().map(o =>
        `<li>${new Date(o.start).toLocaleString()} · <strong>${duration(o.seconds)}</strong> · ${o.ongoing ? "still down" : FIXED_BY[o.fixedBy] || o.fixedBy}
          <span class="why">${routerSummary(o.router) ? "· " + routerSummary(o.router) : ""}</span></li>`
      ).join("");

      el.innerHTML = `<h2>Outages</h2>
        <div class="outage-strip">${days}${segs}</div>
        <div class="outage-summary">${summary}</div>
        ${list ? `<ul class="outage-list">${list}</ul>` : ""}`;
    }

    function weekStart(timestamp) {
      const d = new Date(timestamp);
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      return d;
    }

    function groupByWeek(samples) {
      const weeks = new Map();
      for (const s of samples) {
        const key = weekStart(s.timestamp).getTime();
        if (!weeks.has(key)) weeks.set(key, []);
        weeks.get(key).push(s);
      }
      return [...weeks.entries()].sort((a, b) => a[0] - b[0]).map(([start, samples]) => ({ start, samples }));
    }

    function weekLabel(start) {
      const from = new Date(start), to = new Date(start + 6 * 86400000);
      const fmt = d => d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
      return `${fmt(from)} – ${fmt(to)}`;
    }

    function average(samples, key) {
      const values = samples.map(s => s[key]).filter(v => v !== null);
      return values.length ? values.reduce((a, b) => a + b, 0) / values.length : null;
    }

    function renderStats(samples) {
      document.getElementById("stats").innerHTML = TABLE_METRICS.map(key => {
        const metric = METRICS[key];
        const value = average(samples, key);
        const tip = [metric.tip, bandSentence(metric)].filter(Boolean).join(" ");
        return `<div class="stat">
          <div class="label">${metric.label}<span class="info" tabindex="0">i<span class="tip">${tip}</span></span></div>
          <div class="value ${value === null ? "dim" : ""}">${value === null ? "—" : `${Format.number(value)} ${metric.unit}`}</div>
        </div>`;
      }).join("");
    }

    function renderTable(samples) {
      document.getElementById("tableHead").innerHTML =
        "<th>Time</th>"
        + TABLE_METRICS.map(key => `<th>${METRICS[key].label} (${METRICS[key].unit})</th>`).join("")
        + TEXT_COLUMNS.map(col => `<th>${col.label}</th>`).join("");
      const columns = s =>
        TABLE_METRICS.map(key => (s[key] === null ? `<td class="dim">—</td>` : `<td>${Format.number(s[key])}</td>`)).join("")
        + TEXT_COLUMNS.map(col => (s[col.key] === null ? `<td class="dim">—</td>` : `<td>${s[col.key]}</td>`)).join("");
      document.getElementById("tableBody").innerHTML = samples.slice().reverse().map(s =>
        `<tr><td>${new Date(s.timestamp).toLocaleString()}</td>${columns(s)}</tr>`
      ).join("") || `<tr><td colspan="${TABLE_METRICS.length + TEXT_COLUMNS.length + 1}">no samples yet</td></tr>`;
    }

    function renderCharts(samples) {
      const grid = document.getElementById("chartGrid");
      grid.replaceChildren();
      const times = samples.map(s => s.timestamp);

      for (const chart of CHARTS) {
        const metrics = chart.metrics.map(key => METRICS[key]);
        const hints = [...new Set([chart.note, ...metrics.map(m => [m.blurb, bandSentence(m)].filter(Boolean).join(" "))].filter(Boolean))];

        const block = document.createElement("div");
        block.className = "chart";
        block.innerHTML = `<h2>${chart.title}</h2>
          <div class="legend">${metrics.map(m => `<span><span class="swatch" style="background:${m.color}"></span>${m.legend}</span>`).join("")}</div>
          ${hints.map(h => `<div class="hint">${h}</div>`).join("")}
          <div class="chart-wrap"></div>`;
        grid.appendChild(block);

        Chart.render(block.querySelector(".chart-wrap"), {
          times,
          series: chart.metrics.map(key => ({ ...METRICS[key], values: samples.map(s => s[key]) })),
          range: chart.range,
          bands: metrics.flatMap(bandLines),
        });
      }
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const isTable = btn.dataset.tab === "table";
        document.getElementById("chartsView").hidden = isTable;
        document.getElementById("tableView").hidden = !isTable;
      });
    });

    let weeks = [];
    let selected = 0;

    function showWeek(index) {
      selected = Math.max(0, Math.min(weeks.length - 1, index));
      const week = weeks[selected];

      document.getElementById("weekLabel").textContent = weekLabel(week.start);
      document.getElementById("weekMeta").textContent =
        `${week.samples.length} samples · week ${selected + 1} of ${weeks.length}`;
      document.getElementById("weekPrev").disabled = selected === 0;
      document.getElementById("weekNext").disabled = selected === weeks.length - 1;

      renderOutages(week.start);
      renderStats(week.samples);
      renderTable(week.samples);
      renderCharts(week.samples);
    }

    document.getElementById("weekPrev").addEventListener("click", () => showWeek(selected - 1));
    document.getElementById("weekNext").addEventListener("click", () => showWeek(selected + 1));

    async function load() {
      const [samples, events] = await Promise.all([fetchAllRows().then(toSamples), fetchEvents()]);
      const firstStart = events.find(e => e.event === "start");
      watchdogSince = firstStart ? new Date(firstStart.timestamp) : null;
      outages = toOutages(events);
      const latest = samples[samples.length - 1];

      document.getElementById("sub").textContent =
        samples.length + " samples in total · latest " + (latest ? new Date(latest.timestamp).toLocaleString() : "n/a") +
        " · stats below average the selected week, hover a chart for a single reading · reload this page to refresh";

      weeks = groupByWeek(samples);
      if (!weeks.length) weeks = [{ start: weekStart(new Date().toISOString()).getTime(), samples: [] }];
      showWeek(weeks.length - 1);
    }

    load().catch(err => { document.getElementById("sub").textContent = "failed to load metrics.jsonl: " + err; });
  </script>
</body>
</html>
