<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cloudio signal</title>
<style>
  body { font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #111; color: #ddd; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 12px; margin-bottom: 20px; }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat { min-width: 110px; }
  .stat .label { color: #888; font-size: 11px; text-transform: uppercase; }
  .stat .value { font-size: 22px; font-weight: 600; }
  .stat .value.dim { color: #555; }
  svg { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 4px; }
  .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px; margin-bottom: 24px; }
  @media (max-width: 900px) {
    .chart-grid { grid-template-columns: 1fr; }
  }
  .chart h2 { font-size: 13px; color: #aaa; margin: 0 0 6px; }
  .legend { font-size: 11px; color: #888; margin-bottom: 6px; }
  .legend span { margin-right: 14px; }
  .swatch { display: inline-block; width: 8px; height: 8px; margin-right: 4px; }
  .hint { font-size: 11px; color: #666; margin: -2px 0 8px; }
  .pt { pointer-events: none; }
  .threshold-label { font-size: 9px; }
  .chart-wrap { position: relative; }
  .chart-wrap svg { cursor: crosshair; width: 100%; height: auto; display: block; }

  #tooltip { position: fixed; display: none; background: #222; border: 1px solid #333;
    border-radius: 5px; padding: 6px 9px; font-size: 12px; line-height: 1.5; color: #ddd;
    pointer-events: none; z-index: 20; box-shadow: 0 4px 14px rgba(0,0,0,0.4); white-space: nowrap; }
  #tooltip .tt-time { color: #888; font-size: 10.5px; margin-bottom: 2px; }

  .info { position: relative; display: inline-block; width: 12px; height: 12px; margin-left: 4px;
    border: 1px solid #666; border-radius: 50%; color: #888; font-size: 9px; line-height: 11px;
    text-align: center; text-transform: none; cursor: help; }
  .info .tip { display: none; position: absolute; bottom: 130%; left: 0; width: 230px;
    background: #222; border: 1px solid #333; border-radius: 5px; padding: 8px 10px;
    font-size: 11.5px; line-height: 1.45; color: #ccc; text-transform: none; font-weight: 400;
    z-index: 10; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
  .info:hover .tip, .info:focus .tip { display: block; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #999; padding: 6px 14px;
    border-radius: 5px; font-size: 13px; cursor: pointer; }
  .tab-btn.active { background: #2a2a2a; color: #fff; border-color: #3a3a3a; }
  .tab-btn:hover { color: #ddd; }

  .table-wrap { overflow-x: auto; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { padding: 7px 12px; text-align: right; border-bottom: 1px solid #222; white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #888; font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.03em; }
  tbody tr:hover td { background: #202020; }
  td.dim { color: #555; }
</style>
</head>
<body>
  <h1>cloudio signal</h1>
  <div class="sub" id="sub">loading metrics.jsonl&hellip;</div>
  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="charts" type="button">Charts</button>
    <button class="tab-btn" data-tab="table" type="button">Table</button>
  </div>

  <div id="chartsView">
    <div class="chart-grid" id="chartGrid"></div>
  </div>

  <div id="tableView" hidden>
    <div class="table-wrap">
      <table>
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // --- Readings ------------------------------------------------------------
    // The collector writes typed readings (numbers, or null when absent), so
    // "has a reading" is one rule everywhere.
    const Format = {
      value: v => (typeof v === "number" && Number.isFinite(v) ? v : null),
      number: v => String(Math.round(v * 10) / 10),
      signed: v => (v < 0 ? "−" + Math.abs(v) : String(v)),
    };

    // --- Metric definitions ----------------------------------------------------
    // The one place a metric's meaning lives: where it's read from, its unit,
    // colour, explanation and quality bands. Stat tiles, chart hints, chart
    // threshold lines and the table all derive from this.
    const TEMP_BANDS = { above: { at: 75, word: "caution (est.)", tone: "bad" } };

    const METRICS = {
      downloadMbps: {
        label: "Download", unit: "Mbps", color: "#4fc3a1", legend: "download Mbps",
        read: r => r.speedtest?.download_mbps,
        tip: "Download throughput to the nearest Ookla server. Matters for file transfers, streaming quality, and app/OS updates.",
      },
      uploadMbps: {
        label: "Upload", unit: "Mbps", color: "#c78a3d", legend: "upload Mbps",
        read: r => r.speedtest?.upload_mbps,
        tip: "Upload throughput to the same server. Matters for video calls, cloud backups, and anything that pushes data out &mdash; e.g. the Anran cameras' remote-view stream.",
      },
      pingMs: {
        label: "Ping", unit: "ms",
        read: r => r.speedtest?.ping_ms,
        tip: "Round-trip time to the test server. Lower means snappier calls, gaming, and remote access (SSH/Proxmox UI over Tailscale).",
      },
      jitterMs: {
        label: "Jitter", unit: "ms",
        read: r => r.speedtest?.jitter_ms,
        tip: "How much ping varies between packets, not just its average. High jitter causes choppy audio/video even when average ping looks fine &mdash; often a better predictor of a \"laggy\" call than ping itself.",
      },
      nrRsrp: {
        label: "NR RSRP", unit: "dBm", color: "#4fc3a1", legend: "signal power",
        read: r => r.zte?.Z5g_rsrp,
        tip: "5G NR reference signal power from the tower, in dBm.",
        blurb: "Closer to 0 is stronger.",
        bands: { above: { at: -80, word: "strong" }, between: "workable", below: { at: -100, word: "weak" } },
      },
      nrSinr: {
        label: "NR SINR", unit: "dB", color: "#c78a3d", legend: "signal cleanliness",
        read: r => r.zte?.Z5g_SINR,
        tip: "Signal-to-interference-plus-noise ratio, in dB &mdash; how clean the signal is, not just how strong.",
        blurb: "Higher is cleaner &mdash; predicts real achievable speed better than RSRP alone.",
        bands: { above: { at: 13, word: "good" }, between: "fair", below: { at: 0, word: "poor" } },
      },
      mdmTempC: {
        label: "4G modem", unit: "°C", color: "#4fc3a1", legend: "4G modem",
        read: r => r.zte?.pm_sensor_mdm,
        tip: "4G modem chip temperature, in &deg;C, as reported by the router itself. Tracked to catch a thermal shutdown before it takes the connection down.",
        bands: TEMP_BANDS,
      },
      modem5gTempC: {
        label: "5G modem", unit: "°C", color: "#c78a3d", legend: "5G modem",
        read: r => r.zte?.pm_modem_5g,
        tip: "5G modem chip temperature, in &deg;C. Runs separately from the 4G modem; either one overheating can drop the connection.",
        bands: TEMP_BANDS,
      },
    };

    const TABLE_METRICS = ["downloadMbps", "uploadMbps", "pingMs", "jitterMs", "nrRsrp", "nrSinr", "mdmTempC", "modem5gTempC"];

    // Fixed, domain-meaningful axes: auto-scaling misrepresents proportion, and
    // a flat reading auto-scaled to its own range draws a degenerate axis.
    // Different units get separate charts, never a dual axis.
    const CHARTS = [
      { title: "Throughput", metrics: ["downloadMbps", "uploadMbps"], range: { min: 0, max: 700 } },
      { title: "NR RSRP (dBm)", metrics: ["nrRsrp"], range: { min: -120, max: -60 } },
      { title: "NR SINR (dB)", metrics: ["nrSinr"], range: { min: -10, max: 30 } },
      {
        title: "Modem Temperature (&deg;C)", metrics: ["mdmTempC", "modem5gTempC"], range: { min: 0, max: 100 },
        note: "ZTE doesn't publish an exact shutdown threshold; the line marks a general caution zone for cellular PA hardware, not a documented cutoff.",
      },
    ];

    function bandSentence(metric) {
      const b = metric.bands;
      if (!b || !b.above || !b.below) return "";
      const hi = Format.signed(b.above.at), lo = Format.signed(b.below.at);
      return `${hi} or better: ${b.above.word} &middot; ${lo} to ${hi}: ${b.between} &middot; below ${lo}: ${b.below.word}.`;
    }

    function bandLines(metric) {
      const b = metric.bands || {};
      return [
        b.above && { at: b.above.at, label: `${b.above.word} ↑`, tone: b.above.tone || "good" },
        b.below && { at: b.below.at, label: `${b.below.word} ↓`, tone: b.below.tone || "bad" },
      ].filter(Boolean);
    }

    // --- Chart module ------------------------------------------------------------
    // Draws one fixed-axis time series chart into a container. Owns its own
    // size, geometry, threshold lines, empty state and hover tooltip; callers
    // only supply readings aligned to `times`.
    const Chart = (() => {
      const NS = "http://www.w3.org/2000/svg";
      const W = 900, H = 180, PAD = 34;
      const TONES = { good: "#5fa88f", bad: "#b1544a" };
      let tooltip;

      function node(name, attrs, text) {
        const e = document.createElementNS(NS, name);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text != null) e.textContent = text;
        return e;
      }

      function tooltipEl() {
        if (!tooltip) {
          tooltip = document.createElement("div");
          tooltip.id = "tooltip";
          document.body.appendChild(tooltip);
        }
        return tooltip;
      }

      // Hovering anywhere over the chart snaps to the nearest sample that has a
      // reading for this chart, so a failed collection run never blanks the
      // tooltip when a real reading sits one sample over.
      function hover(svg, times, series) {
        const tip = tooltipEl();
        const n = times.length;
        const hasReading = i => series.some(s => s.values[i] !== null);

        function nearest(clientX) {
          const r = svg.getBoundingClientRect();
          const frac = (((clientX - r.left) / r.width) * W - PAD) / (W - PAD * 2);
          const idx = Math.max(0, Math.min(n - 1, Math.round(frac * (n - 1))));
          for (let d = 0; d < n; d++) {
            if (idx - d >= 0 && hasReading(idx - d)) return idx - d;
            if (idx + d < n && hasReading(idx + d)) return idx + d;
          }
          return -1;
        }

        svg.onmousemove = e => {
          const i = nearest(e.clientX);
          if (i < 0) { tip.style.display = "none"; return; }
          const lines = series
            .filter(s => s.values[i] !== null)
            .map(s => `<div>${s.label}: ${Format.number(s.values[i])} ${s.unit}</div>`);
          tip.innerHTML = `<div class="tt-time">${new Date(times[i]).toLocaleString()}</div>${lines.join("")}`;
          tip.style.display = "block";
          // Measured after display:block (a hidden element has zero size), then
          // flipped to the other side of the cursor if it would leave the viewport.
          const tw = tip.offsetWidth, th = tip.offsetHeight;
          let left = e.clientX + 14, top = e.clientY + 14;
          if (left + tw > window.innerWidth) left = e.clientX - tw - 14;
          if (top + th > window.innerHeight) top = e.clientY - th - 14;
          tip.style.left = Math.max(4, left) + "px";
          tip.style.top = Math.max(4, top) + "px";
        };
        svg.onmouseleave = () => { tip.style.display = "none"; };
      }

      function render(container, { times, series, range, bands = [] }) {
        const svg = node("svg", { viewBox: `0 0 ${W} ${H}` });
        container.replaceChildren(svg);

        if (!series.some(s => s.values.filter(v => v !== null).length >= 2)) {
          svg.appendChild(node("text", { x: W / 2, y: H / 2, fill: "#555", "text-anchor": "middle", "font-size": 12 }, "not enough data yet"));
          return;
        }

        const n = times.length;
        const x = i => PAD + (n === 1 ? 0 : i / (n - 1)) * (W - PAD * 2);
        const y = v => H - PAD - ((v - range.min) / (range.max - range.min)) * (H - PAD * 2);

        const drawn = new Set();
        for (const band of bands) {
          if (drawn.has(band.at) || band.at < range.min || band.at > range.max) continue;
          drawn.add(band.at);
          const color = TONES[band.tone];
          svg.appendChild(node("line", {
            x1: PAD, x2: W - 4, y1: y(band.at).toFixed(1), y2: y(band.at).toFixed(1),
            stroke: color, "stroke-width": 1, "stroke-dasharray": "4,3", opacity: 0.6,
          }));
          svg.appendChild(node("text", { class: "threshold-label", x: PAD + 4, y: (y(band.at) - 3).toFixed(1), fill: color }, band.label));
        }

        for (const s of series) {
          const points = s.values.flatMap((v, i) => (v === null ? [] : [[x(i).toFixed(1), y(v).toFixed(1)]]));
          if (points.length >= 2) {
            svg.appendChild(node("polyline", { points: points.map(p => p.join(",")).join(" "), fill: "none", stroke: s.color, "stroke-width": 1.6 }));
          }
          for (const [cx, cy] of points) {
            svg.appendChild(node("circle", { class: "pt", cx, cy, r: 3, fill: s.color }));
          }
        }

        const axisColor = series.length === 1 ? series[0].color : "#888";
        svg.appendChild(node("text", { x: 4, y: PAD, fill: axisColor, "font-size": 10 }, Format.number(range.max)));
        svg.appendChild(node("text", { x: 4, y: H - PAD + 4, fill: axisColor, "font-size": 10 }, Format.number(range.min)));

        hover(svg, times, series);
      }

      return { render };
    })();

    // --- Page ----------------------------------------------------------------------
    function parseJsonl(text) {
      return text.split("\n").filter(Boolean).flatMap(line => {
        try { return [JSON.parse(line)]; } catch { return []; }
      });
    }

    function toSamples(rows) {
      return rows.map(r => {
        const sample = { timestamp: r.timestamp };
        for (const [key, metric] of Object.entries(METRICS)) sample[key] = Format.value(metric.read(r));
        return sample;
      });
    }

    function average(samples, key) {
      const values = samples.map(s => s[key]).filter(v => v !== null);
      return values.length ? values.reduce((a, b) => a + b, 0) / values.length : null;
    }

    function renderStats(samples) {
      const day = samples.filter(s => Date.now() - new Date(s.timestamp).getTime() <= 24 * 3600 * 1000);
      document.getElementById("stats").innerHTML = TABLE_METRICS.map(key => {
        const metric = METRICS[key];
        const value = average(day, key);
        const tip = [metric.tip, bandSentence(metric)].filter(Boolean).join(" ");
        return `<div class="stat">
          <div class="label">${metric.label}<span class="info" tabindex="0">i<span class="tip">${tip}</span></span></div>
          <div class="value ${value === null ? "dim" : ""}">${value === null ? "—" : `${Format.number(value)} ${metric.unit}`}</div>
        </div>`;
      }).join("");
    }

    function renderTable(samples) {
      document.getElementById("tableHead").innerHTML =
        "<th>Time</th>" + TABLE_METRICS.map(key => `<th>${METRICS[key].label} (${METRICS[key].unit})</th>`).join("");
      document.getElementById("tableBody").innerHTML = samples.slice().reverse().map(s =>
        `<tr><td>${new Date(s.timestamp).toLocaleString()}</td>${TABLE_METRICS.map(key =>
          s[key] === null ? `<td class="dim">—</td>` : `<td>${Format.number(s[key])}</td>`).join("")}</tr>`
      ).join("") || `<tr><td colspan="${TABLE_METRICS.length + 1}">no samples yet</td></tr>`;
    }

    function renderCharts(samples) {
      const grid = document.getElementById("chartGrid");
      grid.replaceChildren();
      const times = samples.map(s => s.timestamp);

      for (const chart of CHARTS) {
        const metrics = chart.metrics.map(key => METRICS[key]);
        const hints = [...new Set([chart.note, ...metrics.map(m => [m.blurb, bandSentence(m)].filter(Boolean).join(" "))].filter(Boolean))];

        const block = document.createElement("div");
        block.className = "chart";
        block.innerHTML = `<h2>${chart.title}</h2>
          <div class="legend">${metrics.map(m => `<span><span class="swatch" style="background:${m.color}"></span>${m.legend}</span>`).join("")}</div>
          ${hints.map(h => `<div class="hint">${h}</div>`).join("")}
          <div class="chart-wrap"></div>`;
        grid.appendChild(block);

        Chart.render(block.querySelector(".chart-wrap"), {
          times,
          series: chart.metrics.map(key => ({ ...METRICS[key], values: samples.map(s => s[key]) })),
          range: chart.range,
          bands: metrics.flatMap(bandLines),
        });
      }
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const isTable = btn.dataset.tab === "table";
        document.getElementById("chartsView").hidden = isTable;
        document.getElementById("tableView").hidden = !isTable;
      });
    });

    async function load() {
      const res = await fetch("metrics.jsonl", { cache: "no-store" });
      const samples = toSamples(parseJsonl(await res.text()));
      const latest = samples[samples.length - 1];

      document.getElementById("sub").textContent =
        samples.length + " samples · latest " + (latest ? new Date(latest.timestamp).toLocaleString() : "n/a") +
        " · stats below are 24h averages, hover a chart for the latest reading · reload this page to refresh";

      renderStats(samples);
      renderTable(samples);
      renderCharts(samples);
    }

    load().catch(err => { document.getElementById("sub").textContent = "failed to load metrics.jsonl: " + err; });
  </script>
</body>
</html>
