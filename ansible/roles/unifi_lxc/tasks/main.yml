---
# UniFi Network Application, via Docker, in its own unprivileged LXC — separate
# from the media stack, so its 24/7 Mongo/Java footprint stays isolated.
#
# Native apt install was tried first (MongoDB 7 + openjdk-17 + Ubiquiti's own
# apt repo). It failed: Ubiquiti's "ubiquiti" apt component was found
# publishing an empty Packages file (the repo's signed InRelease listed its
# MD5Sum as the hash of a zero-byte file) -- their repo, not a config bug here.
# Docker (linuxserver.io's image) sidesteps depending on that repo entirely.

- name: Provision the UniFi LXC and bring up its stack
  ansible.builtin.import_role:
    name: docker_lxc
    allow_duplicates: true
  vars:
    docker_lxc_ctid: "{{ unifi_ctid }}"
    docker_lxc_hostname: "{{ unifi_hostname }}"
    docker_lxc_cores: "{{ unifi_lxc_cores }}"
    docker_lxc_memory: "{{ unifi_lxc_memory }}"
    docker_lxc_swap: "{{ unifi_lxc_swap }}"
    docker_lxc_disk_gb: "{{ unifi_lxc_disk_gb }}"
    docker_lxc_storage: "{{ unifi_lxc_storage }}"
    docker_lxc_bridge: "{{ unifi_lxc_bridge }}"
    docker_lxc_ip: "{{ unifi_lxc_ip }}"
    docker_lxc_stack_dir: /opt/unifi-stack
    docker_lxc_dirs:
      - /opt/appdata/unifi
      - /opt/appdata/unifi-db
    docker_lxc_env_template: "{{ playbook_dir }}/roles/unifi_lxc/templates/env.j2"
    docker_lxc_files:
      - { src: "{{ playbook_dir }}/../unifi-stack/docker-compose.yaml", name: docker-compose.yaml, mode: "0644" }
      - { src: "{{ playbook_dir }}/../unifi-stack/init-mongo.sh", name: init-mongo.sh, mode: "0755" }

- name: Compute the UniFi LXC's bare IP (no CIDR suffix)
  ansible.builtin.set_fact:
    unifi_bare_ip: "{{ unifi_lxc_ip | regex_replace('/.*$', '') }}"

- name: Wait for the UniFi app to generate its system.properties
  ansible.builtin.command: "pct exec {{ unifi_ctid }} -- test -f /opt/appdata/unifi/data/system.properties"
  register: unifi_sysprops_exists
  until: unifi_sysprops_exists.rc == 0
  retries: 24
  delay: 5
  changed_when: false
  failed_when: false

- name: Ensure the UniFi Host Inform IP (system_ip) is set correctly
  ansible.builtin.shell:
    cmd: |
      pct exec {{ unifi_ctid }} -- bash -c '
        f=/opt/appdata/unifi/data/system.properties
        want="system_ip={{ unifi_bare_ip }}"
        if grep -qxF "$want" "$f" 2>/dev/null; then
          echo UNCHANGED
        elif grep -q "^system_ip=" "$f" 2>/dev/null; then
          sed -i "s/^system_ip=.*/$want/" "$f"
          echo CHANGED
        else
          echo "$want" >> "$f"
          echo CHANGED
        fi
      '
  register: unifi_sysip_fix
  when: unifi_sysprops_exists.rc == 0
  changed_when: "'CHANGED' in unifi_sysip_fix.stdout"
  # Left unset, the app auto-detects its own address for internal provisioning
  # references -- inside Docker that often resolves to the container's internal
  # bridge IP (e.g. 172.18.0.2), which an AP can never reach. Devices then check
  # in fine (the published port works) but adoption hangs forever at
  # adopted:true / adoption_completed:false. Found by testing directly against
  # the real box, not assumed: verify with `docker logs unifi-network-application`
  # for repeated "ucore/manifest ... Connection refused" (a harmless red herring)
  # alongside "Device adoption - process not finished. Reason: timeout".

- name: Restart the UniFi app container if system_ip was just set
  ansible.builtin.command: "pct exec {{ unifi_ctid }} -- docker restart unifi-network-application"
  when: unifi_sysip_fix.changed | default(false)

- name: Next steps for UniFi
  ansible.builtin.debug:
    msg: >-
      UniFi is starting at https://{{ unifi_bare_ip }}:8443
      -- give Mongo's first-run init a minute. Then create the admin account
      and adopt the U7 Pro Wall APs (set-inform if they don't appear). Turn on
      UniFi's own auto-backup (Settings -> System -> Backups) -- vzdump then
      carries it off-site.
