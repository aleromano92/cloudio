---
# UniFi Network Application, via Docker, in its own unprivileged LXC — separate
# from the media stack, so its 24/7 Mongo/Java footprint stays isolated.
#
# Native apt install was tried first (MongoDB 7 + openjdk-17 + Ubiquiti's own
# apt repo). It failed: Ubiquiti's "ubiquiti" apt component was found
# publishing an empty Packages file (the repo's signed InRelease listed its
# MD5Sum as the hash of a zero-byte file) -- their repo, not a config bug here.
# Docker (linuxserver.io's image) sidesteps depending on that repo entirely.

- name: Ensure the LXC template is downloaded
  ansible.builtin.command:
    cmd: "pveam download {{ lxc_template_storage }} {{ lxc_template_file }}"
    creates: "/var/lib/vz/template/cache/{{ lxc_template_file }}"

- name: Verify the template actually landed on disk
  ansible.builtin.stat:
    path: "/var/lib/vz/template/cache/{{ lxc_template_file }}"
  register: unifi_template_stat
  failed_when: >-
    not unifi_template_stat.stat.exists or unifi_template_stat.stat.size < 1000000

- name: Check whether the UniFi LXC exists
  ansible.builtin.command: "pct status {{ unifi_ctid }}"
  register: unifi_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create the UniFi LXC
  ansible.builtin.command:
    cmd: >-
      pct create {{ unifi_ctid }} {{ lxc_template_storage }}:vztmpl/{{ lxc_template_file }}
      --hostname {{ unifi_hostname }}
      --cores {{ unifi_lxc_cores }}
      --memory {{ unifi_lxc_memory }}
      --swap {{ unifi_lxc_swap }}
      --rootfs {{ unifi_lxc_storage }}:{{ unifi_lxc_disk_gb }}
      --net0 name=eth0,bridge={{ unifi_lxc_bridge }},ip={{ unifi_lxc_ip }},gw={{ pve_gateway }}
      --nameserver 1.1.1.1
      --features nesting=1,keyctl=1
      --unprivileged 1
      --onboot 1
  when: unifi_status.rc != 0

- name: Start the UniFi LXC
  ansible.builtin.command: "pct start {{ unifi_ctid }}"
  register: unifi_start
  changed_when: "'already running' not in (unifi_start.stderr | default(''))"
  failed_when:
    - unifi_start.rc != 0
    - "'already running' not in (unifi_start.stderr | default(''))"

- name: Wait for the container to resolve DNS
  ansible.builtin.command: "pct exec {{ unifi_ctid }} -- getent hosts download.docker.com"
  register: unifi_dns
  until: unifi_dns.rc == 0
  retries: 20
  delay: 3
  changed_when: false

- name: Install Docker inside the UniFi LXC
  ansible.builtin.shell:
    cmd: |
      pct exec {{ unifi_ctid }} -- bash -euc '
        command -v docker >/dev/null 2>&1 && exit 0
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y ca-certificates curl
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
        . /etc/os-release
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
        apt-get update
        apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
        systemctl enable --now docker
      '
  register: unifi_docker
  changed_when: "'Setting up docker-ce ' in unifi_docker.stdout"

- name: Create app directories in the container
  ansible.builtin.command: >-
    pct exec {{ unifi_ctid }} -- mkdir -p
    /opt/unifi-stack
    /opt/appdata/unifi
    /opt/appdata/unifi-db
  changed_when: false

- name: Render the UniFi stack .env
  ansible.builtin.template:
    src: env.j2
    dest: /root/.cloudio-unifi.env
    mode: "0600"

- name: Push docker-compose.yaml into the container
  ansible.builtin.command:
    cmd: >-
      pct push {{ unifi_ctid }}
      {{ playbook_dir }}/../unifi-stack/docker-compose.yaml
      /opt/unifi-stack/docker-compose.yaml --perms 0644
  changed_when: true

- name: Push init-mongo.sh into the container
  ansible.builtin.command:
    cmd: >-
      pct push {{ unifi_ctid }}
      {{ playbook_dir }}/../unifi-stack/init-mongo.sh
      /opt/unifi-stack/init-mongo.sh --perms 0755
  changed_when: true

- name: Push the rendered .env into the container
  ansible.builtin.command:
    cmd: "pct push {{ unifi_ctid }} /root/.cloudio-unifi.env /opt/unifi-stack/.env --perms 0600"
  changed_when: true

- name: Bring up the UniFi stack
  ansible.builtin.command:
    cmd: "pct exec {{ unifi_ctid }} -- docker compose --project-directory /opt/unifi-stack up -d --remove-orphans"
  register: unifi_compose
  changed_when: >-
    'Started' in (unifi_compose.stderr | default('')) or
    'Created' in (unifi_compose.stderr | default(''))

- name: Next steps for UniFi
  ansible.builtin.debug:
    msg: >-
      UniFi is starting at https://{{ unifi_lxc_ip | regex_replace('/.*$', '') }}:8443
      -- give Mongo's first-run init a minute. Then create the admin account
      and adopt the U7 Pro Wall APs (set-inform if they don't appear). Turn on
      UniFi's own auto-backup (Settings -> System -> Backups) -- vzdump then
      carries it off-site.
