# Managed by Ansible (proxmox_base role).
# The discrete GeForce GT 740M is unused on this headless server. Blacklisting
# the drivers stops them loading -> less power, less heat, fewer boot/suspend
# glitches. See docs/adr/0001.
blacklist nouveau
blacklist nvidia
blacklist nvidiafb
blacklist rivafb
options nouveau modeset=0
