---
- name: Add the Tailscale apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Add the Tailscale apt repo
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: "0644"

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Allow IP forwarding (needed to advertise a subnet route)
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding

- name: Check the Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false

- name: Connect Tailscale (first-time auth only)
  ansible.builtin.command: >-
    tailscale up
    --authkey {{ vault_tailscale_auth_key }}
    --advertise-routes={{ tailscale_advertise_routes }}
    {{ tailscale_extra_args }}
  when:
    - vault_tailscale_auth_key | default('') | length > 0
    - '"\"Running\"" not in ts_status.stdout'
  no_log: true

- name: Keep the advertised subnet route in sync with vars.yml (tailscale up above only runs once, at first auth)
  ansible.builtin.shell:
    cmd: |
      set -e
      current=$(tailscale debug prefs 2>/dev/null | tr -d ' \t\n' | grep -oP '"AdvertiseRoutes":\[\K[^]]*')
      want='"{{ tailscale_advertise_routes }}"'
      if [ "$current" = "$want" ]; then
        echo UNCHANGED
      else
        tailscale set --advertise-routes={{ tailscale_advertise_routes }}
        echo CHANGED
      fi
  register: ts_route_sync
  when:
    - vault_tailscale_auth_key | default('') | length > 0
    - '"\"Running\"" in ts_status.stdout'
  changed_when: "'CHANGED' in ts_route_sync.stdout"
  # "Connect Tailscale" above only runs `tailscale up` (which is what
  # actually sets --advertise-routes) on FIRST auth, gated on the backend
  # not already being "Running" -- but Tailscale can stay "Running"
  # continuously even after lan_cidr changes in vars.yml (it rides the WAN,
  # not the LAN), so that condition can be false on every later run and the
  # advertised route would silently stay stale forever, with no error
  # anywhere. `tailscale set` updates it without needing the authkey again.
