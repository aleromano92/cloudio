---
- name: Create the media mount point
  ansible.builtin.file:
    path: "{{ media_disk_mount }}"
    state: directory
    mode: "0755"

- name: Stop USB devices from auto-suspending (keeps the external drive awake)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/usb-no-autosuspend.conf
    content: "options usbcore autosuspend=-1\n"
    owner: root
    group: root
    mode: "0644"
  notify: update initramfs

- name: Mount the external media drive by UUID
  ansible.posix.mount:
    path: "{{ media_disk_mount }}"
    src: "UUID={{ media_disk_uuid }}"
    fstype: ext4
    opts: "defaults,nofail,x-systemd.device-timeout=30s"
    state: mounted
  when: media_disk_uuid != "CHANGE-ME"

# Nothing remounts the drive when it drops off USB and comes back (a power cut
# did this on 2026-10-02), and the media LXC keeps the dead mount. A udev rule
# runs a script that remounts it and reboots the LXC if it can't read /data.
- name: Install the media drive reattach script
  ansible.builtin.template:
    src: media-disk-reattach.sh.j2
    dest: /usr/local/sbin/media-disk-reattach.sh
    owner: root
    group: root
    mode: "0750"
  when: media_disk_uuid != "CHANGE-ME"

- name: Install the media drive reattach service
  ansible.builtin.template:
    src: media-disk-reattach.service.j2
    dest: /etc/systemd/system/media-disk-reattach.service
    owner: root
    group: root
    mode: "0644"
  notify: systemd daemon-reload
  when: media_disk_uuid != "CHANGE-ME"

- name: Install the udev rule that triggers it when the drive appears
  ansible.builtin.template:
    src: 99-media-disk.rules.j2
    dest: /etc/udev/rules.d/99-media-disk.rules
    owner: root
    group: root
    mode: "0644"
  notify: reload udev rules
  when: media_disk_uuid != "CHANGE-ME"

- name: Warn when the media drive UUID is not set yet
  ansible.builtin.debug:
    msg: >-
      media_disk_uuid is still CHANGE-ME, so the external drive is NOT mounted.
      Format it ext4, run `blkid`, put the UUID in group_vars/all/vars.yml, and
      re-run with --tags storage,media.
  when: media_disk_uuid == "CHANGE-ME"
