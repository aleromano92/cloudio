---
# Proxmox ships with the enterprise repo enabled, which 401s without a
# subscription. Disable it and add pve-no-subscription instead.
#
# NOTE: Proxmox 8.2+ may use deb822 *.sources files. If /etc/apt/sources.list.d
# contains pve-enterprise.sources (not .list), adjust the first two tasks to
# edit those instead (set `Enabled: false`).

- name: Disable the Proxmox enterprise repo
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    regexp: '^(deb\s+https://enterprise\.proxmox\.com.*)$'
    replace: '# \1'
  failed_when: false

- name: Disable the Ceph enterprise repo
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/ceph.list
    regexp: '^(deb\s+https://enterprise\.proxmox\.com.*)$'
    replace: '# \1'
  failed_when: false

- name: Add the Proxmox no-subscription repo
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription"
    filename: pve-no-subscription
    state: present

- name: Remove the "no valid subscription" popup (cosmetic; safe to skip)
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: "(\\s+)Ext\\.Msg\\.show\\(\\{\\s+title: gettext\\('No valid sub"
    replace: "\\1void({ //"
  failed_when: false
  notify: restart pveproxy
