---
# Proxmox ships with the enterprise repo (and, since PVE9, an enterprise Ceph
# repo too) enabled by default -- both 401 without a paid subscription. PVE9
# writes these in deb822 format (*.sources); older installs may still have the
# legacy one-line *.list files. Find whichever exist and disable both kinds by
# renaming (apt ignores anything not ending in .list/.sources), then add
# pve-no-subscription.

- name: Find enabled Proxmox/Ceph enterprise apt source files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "pve-enterprise.*"
      - "ceph.*"
    excludes:
      - "*.disabled"
  register: enterprise_source_files

- name: Disable each enterprise apt source file found
  ansible.builtin.command:
    cmd: "mv {{ item.path }} {{ item.path }}.disabled"
    creates: "{{ item.path }}.disabled"
  loop: "{{ enterprise_source_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Add the Proxmox no-subscription repo
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription"
    filename: pve-no-subscription
    state: present
    update_cache: false   # packages.yml does the real `apt update`, with retries

- name: Remove the "no valid subscription" popup (cosmetic; safe to skip)
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: "(\\s+)Ext\\.Msg\\.show\\(\\{\\s+title: gettext\\('No valid sub"
    replace: "\\1void({ //"
  failed_when: false
  notify: restart pveproxy
