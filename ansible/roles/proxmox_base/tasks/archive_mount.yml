---
# The archive drive holds the photos and personal files plus the local
# backups. Mounted by UUID with nofail like the media drive, so a missing drive
# never blocks boot; a udev rule mounts it again when it drops off USB and
# comes back (a power cut does that, see usb_media_mount.yml).
- name: Create the archive mount point
  ansible.builtin.file:
    path: "{{ archive_disk_mount }}"
    state: directory
    mode: "0755"

- name: Mount the archive drive by UUID
  ansible.posix.mount:
    path: "{{ archive_disk_mount }}"
    src: "UUID={{ archive_disk_uuid }}"
    fstype: ext4
    opts: "defaults,nofail,x-systemd.device-timeout=30s"
    state: mounted

- name: Install the udev rule that remounts it when the drive reappears
  ansible.builtin.template:
    src: 99-archive-disk.rules.j2
    dest: /etc/udev/rules.d/99-archive-disk.rules
    owner: root
    group: root
    mode: "0644"
  notify: reload udev rules
