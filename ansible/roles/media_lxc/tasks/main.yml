---
- name: Create the media folders on the drive, owned by the stack's user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ 100000 + media_puid | int }}"
    group: "{{ 100000 + media_pgid | int }}"
    mode: "0755"
  loop: >-
    {{ [media_disk_mount, media_disk_mount ~ '/media']
       + media_data_subdirs | map('regex_replace', '^', media_disk_mount ~ '/') | list }}
  when: media_disk_uuid != "CHANGE-ME"

- name: Provision the media LXC and bring up its stack
  ansible.builtin.import_role:
    name: docker_lxc
    allow_duplicates: true
  vars:
    docker_lxc_ctid: "{{ media_ctid }}"
    docker_lxc_hostname: "{{ media_hostname }}"
    docker_lxc_cores: "{{ media_lxc_cores }}"
    docker_lxc_memory: "{{ media_lxc_memory }}"
    docker_lxc_swap: "{{ media_lxc_swap }}"
    docker_lxc_disk_gb: "{{ media_lxc_disk_gb }}"
    docker_lxc_storage: "{{ media_lxc_storage }}"
    docker_lxc_bridge: "{{ media_lxc_bridge }}"
    docker_lxc_ip: "{{ media_lxc_ip }}"
    docker_lxc_create_args: "--mp0 {{ media_disk_mount }},mp=/data,backup=0"
    docker_lxc_stack_dir: /opt/media-stack
    docker_lxc_dirs: "{{ media_appdata_services | map('regex_replace', '^', '/opt/appdata/') | list }}"
    docker_lxc_env_template: "{{ playbook_dir }}/roles/media_lxc/templates/env.j2"
    docker_lxc_files:
      - { src: "{{ playbook_dir }}/../media-stack/docker-compose.yaml", name: docker-compose.yaml, mode: "0644" }
      - { src: "{{ playbook_dir }}/../media-stack/Caddyfile", name: Caddyfile, mode: "0644" }
      - { src: "{{ playbook_dir }}/../media-stack/qbittorrent-configure.py", name: qbittorrent-configure.py, mode: "0755" }
      - { src: "{{ playbook_dir }}/../media-stack/arr-autoimport.py", name: arr-autoimport.py, mode: "0644" }

- name: Render qBittorrent's desired settings on the node
  ansible.builtin.copy:
    content: "{{ qbittorrent_preferences | to_nice_json }}\n"
    dest: /root/.cloudio-media-qbittorrent-preferences.json
    mode: "0644"

- name: Push qBittorrent's desired settings into the container
  ansible.builtin.command: >-
    pct push {{ media_ctid }} /root/.cloudio-media-qbittorrent-preferences.json
    /opt/media-stack/qbittorrent-preferences.json --perms 0644
  changed_when: false

- name: Apply qBittorrent's settings through its web API
  ansible.builtin.command: >-
    pct exec {{ media_ctid }} -- python3 /opt/media-stack/qbittorrent-configure.py
    /opt/media-stack/qbittorrent-preferences.json
  register: media_qbittorrent_prefs
  changed_when: media_qbittorrent_prefs.stdout.startswith('CHANGED')

- name: Install the weekly update of the *arr apps
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - cloudio-media-update.service
    - cloudio-media-update.timer

- name: Enable the weekly update of the *arr apps
  ansible.builtin.systemd:
    name: cloudio-media-update.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Reload Caddy, which reads its Caddyfile only at start or reload
  ansible.builtin.command: >-
    pct exec {{ media_ctid }} -- docker exec caddy
    caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
  changed_when: false

- name: Install Avahi in the media LXC, to announce the .local names
  ansible.builtin.command: >-
    pct exec {{ media_ctid }} -- bash -euc '
    dpkg -s avahi-daemon avahi-utils >/dev/null 2>&1 && exit 0;
    apt-get update;
    DEBIAN_FRONTEND=noninteractive apt-get install -y avahi-daemon avahi-utils;
    echo INSTALLED'
  register: media_avahi_install
  changed_when: "'INSTALLED' in media_avahi_install.stdout"

- name: Keep Avahi on the LAN interface, off Docker's bridges
  ansible.builtin.command: >-
    pct exec {{ media_ctid }} -- bash -euc '
    grep -qx "allow-interfaces=eth0" /etc/avahi/avahi-daemon.conf && exit 0;
    sed -i -E "s/^.?allow-interfaces=.*/allow-interfaces=eth0/" /etc/avahi/avahi-daemon.conf;
    grep -qx "allow-interfaces=eth0" /etc/avahi/avahi-daemon.conf;
    systemctl restart avahi-daemon;
    echo CHANGED'
  register: media_avahi_conf
  changed_when: "'CHANGED' in media_avahi_conf.stdout"

- name: Render the mDNS alias unit on the node
  ansible.builtin.template:
    src: cloudio-mdns-alias@.service.j2
    dest: /root/.cloudio-media-mdns-alias@.service
    mode: "0644"
  register: media_mdns_unit

- name: Push the mDNS alias unit into the media LXC
  ansible.builtin.command: >-
    pct push {{ media_ctid }} /root/.cloudio-media-mdns-alias@.service
    /etc/systemd/system/cloudio-mdns-alias@.service --perms 0644
  when: media_mdns_unit.changed

- name: Announce every .local name in the Caddyfile
  ansible.builtin.command: >-
    pct exec {{ media_ctid }} -- bash -euc '
    systemctl daemon-reload;
    for n in {{ media_local_names | join(" ") }}; do
    if [ {{ media_mdns_unit.changed | lower }} = true ]; then systemctl restart cloudio-mdns-alias@$n; fi;
    systemctl is-enabled --quiet cloudio-mdns-alias@$n && systemctl is-active --quiet cloudio-mdns-alias@$n && continue;
    systemctl enable --now cloudio-mdns-alias@$n;
    echo CHANGED;
    done'
  vars:
    media_local_names: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../media-stack/Caddyfile')
         | regex_findall('http://([a-z0-9-]+)\.local') }}
  register: media_mdns_aliases
  changed_when: "'CHANGED' in media_mdns_aliases.stdout or media_mdns_unit.changed"
