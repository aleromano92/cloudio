---
# The media stack: one unprivileged LXC running Docker + docker-compose.
# See docs/adr/0002 (config in git, state in backups).

- name: Provision the media LXC and bring up its stack
  ansible.builtin.import_role:
    name: docker_lxc
    allow_duplicates: true
  vars:
    docker_lxc_ctid: "{{ media_ctid }}"
    docker_lxc_hostname: "{{ media_hostname }}"
    docker_lxc_cores: "{{ media_lxc_cores }}"
    docker_lxc_memory: "{{ media_lxc_memory }}"
    docker_lxc_swap: "{{ media_lxc_swap }}"
    docker_lxc_disk_gb: "{{ media_lxc_disk_gb }}"
    docker_lxc_storage: "{{ media_lxc_storage }}"
    docker_lxc_bridge: "{{ media_lxc_bridge }}"
    docker_lxc_ip: "{{ media_lxc_ip }}"
    docker_lxc_create_args: "--mp0 {{ media_disk_mount }},mp=/data,backup=0"
    docker_lxc_stack_dir: /opt/media-stack
    docker_lxc_dirs: >-
      {{ media_appdata_services | map('regex_replace', '^', '/opt/appdata/') | list
         + media_data_subdirs | map('regex_replace', '^', '/data/') | list }}
    docker_lxc_env_template: "{{ playbook_dir }}/roles/media_lxc/templates/env.j2"
    docker_lxc_files:
      - { src: "{{ playbook_dir }}/../media-stack/docker-compose.yaml", name: docker-compose.yaml, mode: "0644" }
