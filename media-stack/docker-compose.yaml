services:
  jellyfin:
    image: jellyfin/jellyfin:10.11
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/jellyfin:/config
      - ${MEDIA}/media:/data/media
    network_mode: host
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4
    container_name: caddy
    network_mode: host
    environment:
      - JELLYFIN_HOST=${JELLYFIN_HOST}
      - HA_HOST=${HA_HOST}
      - HA_UPSTREAM=${HA_UPSTREAM}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APPDATA}/caddy/data:/data
      - ${APPDATA}/caddy/config:/config
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:4.0.16
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/sonarr:/config
      - ${MEDIA}:/data
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/radarr:/config
      - ${MEDIA}:/data
    ports:
      - "7878:7878"
    restart: unless-stopped

  lidarr:
    image: linuxserver/lidarr:3.1.0
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/lidarr:/config
      - ${MEDIA}:/data
    ports:
      - "8686:8686"
    restart: unless-stopped

  prowlarr:
    image: linuxserver/prowlarr:2.3.0
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent:5.1.4
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${APPDATA}/qbittorrent:/config
      - ${MEDIA}:/data
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  arr-autoimport:
    image: python:3.13-alpine
    container_name: arr-autoimport
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - PYTHONUNBUFFERED=1
    command: ["python3", "/app/arr-autoimport.py"]
    volumes:
      - ./arr-autoimport.py:/app/arr-autoimport.py:ro
      - ${APPDATA}/radarr/config.xml:/config/radarr/config.xml:ro
      - ${APPDATA}/sonarr/config.xml:/config/sonarr/config.xml:ro
    depends_on:
      - radarr
      - sonarr
    restart: unless-stopped
