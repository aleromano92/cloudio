# UniFi stack — runs inside the `unifi` LXC, deployed by ansible/roles/unifi_lxc.
#
# Two containers: unifi-db (a dedicated MongoDB 7 — separate from anything in
# the media stack) and unifi-network-application (linuxserver.io's image).
# Native apt install was tried first; Ubiquiti's own "ubiquiti" apt component
# was found publishing an empty Packages file (see git history) — their repo,
# not this config. Docker sidesteps depending on it entirely.
#
# Credentials and paths come from .env (rendered by Ansible from group_vars +
# vault). APPDATA lives on the LXC rootfs (captured by nightly vzdump).

services:
  unifi-db:
    image: docker.io/mongo:7.0
    container_name: unifi-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
      - MONGO_DBNAME=${MONGO_DBNAME}
      - MONGO_AUTHSOURCE=${MONGO_AUTHSOURCE}
    volumes:
      - ${APPDATA}/unifi-db:/data/db
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    restart: unless-stopped

  unifi-network-application:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi-network-application
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
      - MONGO_HOST=unifi-db
      - MONGO_PORT=27017
      - MONGO_DBNAME=${MONGO_DBNAME}
      - MONGO_AUTHSOURCE=${MONGO_AUTHSOURCE}
    volumes:
      - ${APPDATA}/unifi:/config
    ports:
      - "8443:8443"        # admin web UI
      - "3478:3478/udp"    # STUN
      - "10001:10001/udp"  # AP discovery
      - "8080:8080"        # device communication
    restart: unless-stopped
    depends_on:
      - unifi-db
