services:
  jellyfin:
    # Access URLs: 
    # - Regular URL: http://localhost:8096
    # - Local network URL: http://YOUR_COMPUTER_IP:8096 (e.g., http://192.168.1.100:8096)
    # - First time setup wizard (if not appearing): http://localhost:8096/web/index.html#!/wizardstart.html
    # Note: If the setup wizard doesn't appear automatically on first launch,
    # manually navigate to the wizard URL above to start the initial configuration
    #
    # To find your computer's IP:
    # - On macOS: System Preferences → Network or run 'ifconfig' in terminal
    # - The IP should be something like 192.168.1.xxx or 10.0.1.xxx
    #
    # NOTE: Network Configuration
    # On Linux systems, using network_mode: host is recommended for better performance
    # and proper DLNA/network discovery. However, on macOS, host networking doesn't work
    # as expected because Docker Desktop runs in a VM. Therefore, we use bridge networking
    # with explicit port mappings for macOS compatibility.
    #
    # Linux configuration (uncomment if running on Linux):
    # network_mode: host
    image: jellyfin/jellyfin
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      - JELLYFIN_PublishedServerUrl=http://192.168.0.80:8096
    volumes:
      - /Users/aromano/cloudio-volumes/config/jellyfin:/config
      - /Users/aromano/cloudio-volumes/data/media:/data/media
    ports:
      - "8096:8096" # HTTP port for web interface
      - "8920:8920" # HTTPS port
      - "7359:7359/udp" # LAN discovery
      - "1900:1900/udp" # DLNA discovery (now available since Plex is removed)
      - "1901:1901/udp" # Additional DLNA service
    dns:
      - 1.1.1.1
      - 1.0.0.1

  sonarr:
    # Access URL: http://localhost:8989
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - /Users/aromano/cloudio-volumes/config/sonarr:/config
      - /Users/aromano/cloudio-volumes/data:/data
    ports:
      - "8989:8989"
    dns:
      - 1.1.1.1
      - 1.0.0.1

  radarr:
    # Access URL: http://localhost:7878
    # Best guide to initial setup https://trash-guides.info/Radarr/Radarr-Setup/
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - /Users/aromano/cloudio-volumes/config/radarr:/config
      - /Users/aromano/cloudio-volumes/data:/data
    ports:
      - "7878:7878"
    dns:
      - 1.1.1.1
      - 1.0.0.1

  lidarr:
    # Access URL: http://localhost:8686
    image: linuxserver/lidarr
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - /Users/aromano/cloudio-volumes/config/lidarr:/config
      - /Users/aromano/cloudio-volumes/data:/data
    ports:
      - "8686:8686"
    dns:
      - 1.1.1.1
      - 1.0.0.1

  qbittorrent:
    # Access URL: http://localhost:8080
    ## username: admin
    ## password: Check container logs after first start
    ## The temporary password will be shown like:
    # "The WebUI administrator password was not set. A temporary password is provided for this session: XXXXXXXX"
    # Best guide to initial setup https://trash-guides.info/Downloaders/qBittorrent/Basic-Setup/
    # Add categories for the Arr apps: https://trash-guides.info/Downloaders/qBittorrent/How-to-add-categories/
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - /Users/aromano/cloudio-volumes/config/qbittorrent:/config
      - /Users/aromano/cloudio-volumes/data:/data
    ports:
      - "8080:8080"
      - "6881:6881"
    dns:
      - 1.1.1.1
      - 1.0.0.1

  prowlarr:
    # Access URL: http://localhost:9696
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - /Users/aromano/cloudio-volumes/config/prowlarr:/config
    ports:
      - "9696:9696"
    dns:
      - 1.1.1.1
      - 1.0.0.1
