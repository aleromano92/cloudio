services:
  plex:
    # Access URL: http://localhost:32400/web
    image: plexinc/pms-docker
    container_name: plex
    # NOTE: Network Configuration
    # On Linux systems, using network_mode: host is recommended for better performance
    # and proper DLNA/network discovery. However, on macOS, host networking doesn't work
    # as expected because Docker Desktop runs in a VM. Therefore, we use bridge networking
    # with explicit port mappings for macOS compatibility.
    #
    # Linux configuration (uncomment if running on Linux):
    # network_mode: host
    environment:
      - TZ=Europe/Rome
      - PLEX_UID=1000
      - PLEX_GID=1000
    volumes:
      - /Users/aromano/Cloudio/Config/plex:/config
      - /Users/aromano/Cloudio/Data:/data
    # These port mappings are needed for macOS/Windows
    # They can be removed if using network_mode: host on Linux
    ports:
      - "32400:32400/tcp"
      - "3005:3005/tcp"
      - "8324:8324/tcp"
      - "32469:32469/tcp"
      - "1900:1900/udp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"

  sonarr:
    # Access URL: http://localhost:8989
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - /Users/aromano/Cloudio/Config/sonarr:/config
      - /Users/aromano/Cloudio/Data:/data
    ports:
      - "8989:8989"

  radarr:
    # Access URL: http://localhost:7878
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - /Users/aromano/Cloudio/Config/radarr:/config
      - /Users/aromano/Cloudio/Data:/data
    ports:
      - "7878:7878"

  lidarr:
    # Access URL: http://localhost:8686
    image: linuxserver/lidarr
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - /Users/aromano/Cloudio/Config/lidarr:/config
      - /Users/aromano/Cloudio/Data:/data
    ports:
      - "8686:8686"

  # Un gestore di download come qBittorrent
  qbittorrent:
    # Access URL: http://localhost:8080
    # Default credentials: 
    # username: admin
    # password: adminadmin
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - /Users/aromano/Cloudio/Config/qbittorrent:/config
      - /Users/aromano/Cloudio/Data:/data
    ports:
      - "8080:8080"
      - "6881:6881/udp"
